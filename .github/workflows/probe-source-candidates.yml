name: Probe source candidates

# Manual-only discovery job. It hits live publishers to find out which candidate
# firms expose a usable RSS/Atom feed or sitemap, so config/sources.yml entries can
# be written from observed responses rather than guessed URLs (AGENTS.md #9).
#
# It never writes to the repository, the data branch, or Pages — the output is a
# step summary plus a JSON artifact to read before opening the follow-up PR.

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Limit the probe to a single candidate id (see scripts/probe-source-candidates.ts)'
        type: string
        default: ''
      audit_source_id:
        description: 'Also audit one already-enabled source id from config/sources.yml'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: trendsignal-probe-source-candidates
  cancel-in-progress: true

jobs:
  probe:
    name: Probe candidate publishers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe candidates
        env:
          CANDIDATE_ID: ${{ github.event.inputs.candidate_id }}
        run: |
          set -eo pipefail
          args=(--json=probe-report.json)
          if [ -n "$CANDIDATE_ID" ]; then args+=("--candidate-id=$CANDIDATE_ID"); fi
          npx tsx scripts/probe-source-candidates.ts "${args[@]}"

      # docs/adding-a-source.md step 5: a source can be "healthy" while yielding no
      # usable article, so confirm what it actually produces before trusting it.
      - name: Audit enabled sources
        if: inputs.audit_source_id != ''
        env:
          AUDIT_SOURCE_ID: ${{ inputs.audit_source_id }}
        run: npx tsx scripts/audit-sources.ts --source-id="$AUDIT_SOURCE_ID"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-candidate-probe
          path: probe-report.json
          retention-days: 14
          if-no-files-found: warn
