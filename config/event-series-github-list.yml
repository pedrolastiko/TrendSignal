# Conferences from the MrM8BRH/CyberSecurity_Conferences list, researched by hand: the list
# itself carries no dates, so each conference's own site was read (or, where it could not be,
# a web search was used) on the day recorded in `verifiedOn`. Nothing here is fetched at run time.
#
# `confirmed`: the organiser's page (or its ticketing/schedule host) states the date.
# `unconfirmed`: only third-party listings or search summaries do; the card says
# "Date not confirmed". A series with no announced edition is projected from its latest edition
# (same calendar day, only when that edition is less than a year old) and flagged as estimated.
#
# Not included: series whose latest known edition is more than a year old, or that have none
# (dormant, cancelled, or no date findable), and organisers that refuse automated access
# (never bypassed). Add a new edition below as soon as the organiser announces it.
