# Source definitions for TrendSignal.
#
# Validation policy (see AGENTS.md #9): a source is only set to `enabled: true`
# once its feedUrl has been fetched live and confirmed to return a parseable
# RSS/Atom feed or sitemap, AND `npx tsx scripts/audit-sources.ts --source-id=<id>`
# shows it yielding real, dated articles. An HTTP 200 is not sufficient — several
# publishers answer 200 with an HTML app shell for a .xml path.
#
# Every entry below was validated this way on 2026-08-23. Candidates that could not
# be collected were removed rather than left as permanent placeholders:
#
#   - No public feed or sitemap (.xml paths serve an HTML app shell):
#     Accenture, IBM, Oracle, ServiceNow, Zscaler, Sopra Steria.
#   - Redirects to a publisher already covered here: CyberArk (now Palo Alto Networks).
#   - Answer HTTP 403 to the collector on every request, with or without headers,
#     while serving browsers normally — anti-bot protection keyed on the client's TLS
#     fingerprint, which AGENTS.md #9 forbids circumventing: Wired, Ars Technica, BCG.
#     (curl reaches all three, so a curl-only check is not a valid validation.)
#   - Anthropic: no feed, and article pages carry no publication date in static HTML
#     (rendered client-side). The sitemap's `lastmod` is not a substitute — Deloitte
#     shows it running years ahead of the editorial date, which would misdate articles
#     and corrupt trend scoring.
schemaVersion: 1
sources:
