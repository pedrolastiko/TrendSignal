  - id: oliver-wyman-insights
    name: Oliver Wyman Insights
    company: Oliver Wyman
    category: consulting
    homepageUrl: https://www.oliverwyman.com/
    # No feed at any conventional path (all 404). sitemap.xml is a <sitemapindex>
    # of 21 children; the newest ones are article-dense — all 5 sampled pages
    # extracted a title and datePublished from JSON-LD. includePaths keeps the
    # selection on thought leadership and away from media-center and error pages.
    collectionMode: sitemap
    feedUrl: https://www.oliverwyman.com/sitemap.xml
    enabled: true
    priority: 6
    language: en
    maxItemsPerRun: 30
    includePaths: ['/our-expertise/insights/']
    excludePaths: ['/error-pages/', '/contact-us']

  - id: bearingpoint-insights
    name: BearingPoint Insights
    company: BearingPoint
    category: consulting
    homepageUrl: https://www.bearingpoint.com/
    # No feed (all 404). sitemap.xml is a <sitemapindex> of 30 children; 5/5
    # sampled pages extracted title and date, but the freshest entries mix
    # insights with the privacy statement and campaign landing pages, so
    # includePaths pins the selection to the insights-and-events section.
    collectionMode: sitemap
    feedUrl: https://www.bearingpoint.com/sitemap.xml
    enabled: true
    priority: 5
    language: en
    maxItemsPerRun: 30
    includePaths: ['/insights-events/']
    excludePaths: []

  - id: fti-consulting-insights
    name: FTI Consulting Insights
    company: FTI Consulting
    category: consulting
    homepageUrl: https://www.fticonsulting.com/
    # /rss.xml, /atom.xml and /index.xml answer 403, but sitemap.xml is a plain
    # <urlset> of 5423 URLs that serves fine. Only the /insights/articles/ pages
    # carry an extractable date — country insight listings and the
    # videos-and-podcasts entries do not — so includePaths targets just those.
    collectionMode: sitemap
    feedUrl: https://www.fticonsulting.com/sitemap.xml
    enabled: true
    priority: 5
    language: en
    maxItemsPerRun: 30
    includePaths: ['/insights/articles/']
    excludePaths: []

  - id: kearney-insights
    name: Kearney Insights
    company: Kearney
    category: consulting
    homepageUrl: https://www.kearney.com/
    # sitemap.xml is reachable (<urlset>, 4991 URLs) but carries no usable
    # lastmod ordering: the entries it surfaces first are the industry index and
    # careers/diversity pages, none of which expose a publication date (0/5
    # sampled). No article path could be identified to filter on, so this stays
    # disabled rather than shipping a source that collects nothing.
    collectionMode: sitemap
    feedUrl: REPLACE_AFTER_VALIDATION
    enabled: false
    priority: 5
    language: en
    maxItemsPerRun: 30
    includePaths: []
    excludePaths: []

