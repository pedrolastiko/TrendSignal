# Source definitions for TrendSignal.
#
# Validation policy (see AGENTS.md #9): a source is only set to `enabled: true`
# once its feedUrl has been fetched live and confirmed to return a parseable
# RSS/Atom document. Validation was performed on 2026-08-22 with
# `curl -A "TrendSignalBot/1.0" <feedUrl>` and manual inspection of the
# response body. Sources that could not be validated (HTTP error, bot
# detection, HTML instead of XML, or no known public feed) are kept
# `enabled: false` with `feedUrl: REPLACE_AFTER_VALIDATION`.
schemaVersion: 1
sources:
