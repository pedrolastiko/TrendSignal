  - id: deloitte-insights
    name: Deloitte Insights
    company: Deloitte
    category: consulting
    homepageUrl: https://www.deloitte.com/global/en.html
    # No public RSS/Atom feed exists for Deloitte (checked directly and via page
    # <link rel="alternate"> — none present). The listing page at
    # www2.deloitte.com/us/en/insights.html links its whole navigation menu before
    # any article, so it yielded almost nothing; the sitemap declared in
    # robots.txt is both richer and dated. Article pages carry JSON-LD Article
    # metadata (headline/datePublished). includePaths targets the thought-leadership
    # sections and keeps out people profiles, press releases, and service pages.
    # Validated live 2026-08-22 against sitemap_global_en.xml (3828 URLs, 685 in
    # these sections).
    collectionMode: sitemap
    feedUrl: https://www.deloitte.com/global/sitemaps/secured/sitemap_global_en.xml
    enabled: true
    priority: 6
    language: en
    maxItemsPerRun: 30
    includePaths: ['/research/', '/perspectives/', '/blogs/', '/insights/', '/our-thinking/']
    excludePaths: ['/about/people/', '/press-room/', '/recognition/']

  - id: pwc-insights
    name: PwC Insights
    company: PwC
    category: consulting
    homepageUrl: https://www.pwc.com/gx/en/issues.html
    # No public RSS/Atom feed. PwC article pages carry neither JSON-LD Article
    # metadata nor article:published_time — the publication date is only in a
    # proprietary <meta name="pwcReleaseDate">, hence dateMetaNames below.
    # Validated live 2026-08-22 against the gx (global) sitemap: 2420 dated URLs.
    collectionMode: sitemap
    feedUrl: https://www.pwc.com/gx/en/sitemaps/sitemap1.xml
    enabled: true
    priority: 5
    language: en
    maxItemsPerRun: 30
    includePaths: ['/issues/', '/services/', '/industries/']
    excludePaths: ['/about/', '/careers/', '/alliances/', '/case-studies/']
    dateMetaNames: ['pwcReleaseDate']

