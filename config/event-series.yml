# Flagship conferences kept by hand, for organisers whose sites the collector cannot read
# (Black Hat, RSAC and Gartner answer HTTP 403, defcon.org is not reachable from here) and for
# conferences that are one-off pages rather than listings. Nothing here is fetched.
#
# Each edition records where its date was read (`sourceUrl`) and when (`verifiedOn`), and a
# status: `confirmed` only when the organiser, or the venue hosting it, states the date;
# `unconfirmed` when only third-party listings do (shown as "Date not confirmed").
#
# A series with no edition still to come is projected: the latest edition's calendar day is
# assumed to repeat next year and the event is flagged as estimated. Add the new edition here
# as soon as the organiser announces it, and it replaces the projection.
#
# Dates were checked on 2026-11-07. Black Hat and DEF CON could not be read directly, so their
# dates come from what a web search returned.
schemaVersion: 1
series:
  - id: aws-reinvent
    name: AWS re:Invent
    organiser: Amazon Web Services
    category: technology
    url: https://aws.amazon.com/events/reinvent/
    kind: conference
    format: in-person
    location: Las Vegas, NV, United States
    countryCode: US
    summary: AWS's annual conference on cloud and AI.
    editions:
      - startDate: '2026-11-30'
        endDate: '2026-12-04'
        status: confirmed
        sourceUrl: https://aws.amazon.com/events/reinvent/
        verifiedOn: '2026-11-07'

